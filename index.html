<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SAIS — Sacha's Art Inventory System</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A97D40">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAIS">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,500;0,9..144,600;1,9..144,440&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#FBFAF6;
  --paper-alt:#F3EFE5;
  --ink:#221D14;
  --ink-soft:#6B6252;
  --gold:#A97D40;
  --gold-deep:#8A6530;
  --gold-pale:#EBE0C7;
  --line:#E3D9C0;
  --sold:#burlap; /* placeholder unused */
  --shadow: 0 8px 30px rgba(34,29,20,0.10);
  --radius: 3px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-pale);}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-deep);font-weight:600;
}

/* ---------- Header ---------- */
header.site{
  position:sticky;top:0;z-index:40;
  background:rgba(251,250,246,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;
}
.logo-mark{flex:0 0 auto;width:38px;height:38px;}
.brand{flex:1;min-width:0;}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.1;}
.brand .sub{margin:1px 0 0;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);}
.header-actions{display:flex;align-items:center;gap:8px;}
.iconbtn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  transition:border-color .15s,color .15s;
  position:relative;
}
.iconbtn:hover{border-color:var(--gold);color:var(--gold-deep);}
.iconbtn.active{background:var(--gold);border-color:var(--gold);color:var(--paper);}
.iconbtn svg{width:17px;height:17px;}
.doc-count{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--gold);color:#fff;font-size:9.5px;line-height:15px;text-align:center;font-family:'Inter',sans-serif;font-weight:700;}

.toolbar{
  max-width:1200px;margin:0 auto;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;
  padding:0 20px 14px;
}
.field-inline{display:flex;flex-direction:column;gap:3px;}
.field-inline label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.field-inline select,.field-inline input[type=text]{
  border:none;border-bottom:1px solid var(--line);background:transparent;
  padding:4px 2px;font-size:13.5px;color:var(--ink);min-width:130px;
}
.field-inline select:focus,.field-inline input:focus{border-color:var(--gold);}
.searchwrap{flex:1;min-width:160px;max-width:280px;}
.admin-strip{
  margin-left:auto;display:flex;gap:8px;align-items:center;
}
.menu-list{display:flex;flex-direction:column;}
.menu-item{
  display:flex;align-items:center;gap:14px;padding:15px 4px;
  border:none;border-bottom:1px solid var(--line);background:none;
  text-align:left;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);
  cursor:pointer;width:100%;
}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{color:var(--gold-deep);}
.menu-item svg{width:20px;height:20px;flex:0 0 auto;color:var(--gold);}
.menu-item .menu-item-label{flex:1;font-weight:600;}
.menu-item .menu-item-sub{font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
.btn{
  border:1px solid var(--gold);background:transparent;color:var(--gold-deep);
  padding:8px 16px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;border-radius:2px;transition:background .15s,color .15s;
}
.btn:hover{background:var(--gold);color:#fff;}
.btn-solid{background:var(--gold);color:#fff;}
.btn-solid:hover{background:var(--gold-deep);}
.btn-plain{border-color:transparent;color:var(--ink-soft);}
.btn-plain:hover{background:var(--paper-alt);color:var(--ink);}
.btn-danger{border-color:#8a4a3d;color:#8a4a3d;}
.btn-danger:hover{background:#8a4a3d;color:#fff;}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none;}

/* ---------- Gallery ---------- */
main{max-width:1200px;margin:0 auto;padding:6px 20px 80px;}
.state-msg{
  text-align:center;padding:80px 20px;color:var(--ink-soft);
}
.state-msg h3{color:var(--ink);margin:0 0 8px;font-weight:500;font-size:19px;}
.state-msg p{margin:0 0 18px;font-size:14px;}

.grid{
  display:grid;gap:26px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
}
.card{
  position:relative;background:transparent;border:none;text-align:left;padding:0;
  animation:fadein .25s ease both;
}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .imgwrap{
  position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--paper-alt);
  border:1px solid var(--line);
}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;}
.card:hover img{transform:scale(1.035);}
.card .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.catno{
  position:absolute;top:8px;left:8px;background:var(--gold);color:#fff;
  font-size:10px;letter-spacing:.08em;padding:4px 8px 4px 9px;
  clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%);
}
.admin-card-controls{position:absolute;top:8px;right:8px;display:flex;gap:6px;}
.admin-card-controls button{
  width:28px;height:28px;border-radius:50%;border:none;background:rgba(251,250,246,.92);
  display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.admin-card-controls svg{width:14px;height:14px;}
.card .info{padding:12px 2px 0;}
.card .title{font-size:16.5px;font-weight:500;line-height:1.25;margin:0 0 2px;}
.card .artist{font-size:11.5px;color:var(--gold-deep);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:0 0 4px;}
.card .meta{font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
.card .bottomrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.price{font-size:14px;font-weight:600;}
.badge{
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  padding:4px 9px;border-radius:2px;white-space:nowrap;
}
.badge-available{background:var(--gold);color:#fff;}
.badge-reserved{border:1px solid var(--gold);color:var(--gold-deep);}
.badge-sold{background:var(--ink);color:var(--paper);}
.badge-nfs{border:1px solid var(--line);color:var(--ink-soft);}

.divider-hex{display:flex;align-items:center;justify-content:center;margin:36px 0;opacity:.6;}
.divider-hex svg{width:16px;height:16px;}

/* ---------- Swipe view ---------- */
.swipe-screen{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;color:var(--paper);}
.swipe-top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:0 0 auto;}
.swipe-back{width:36px;height:36px;border-radius:50%;border:1px solid rgba(251,250,246,.25);background:rgba(251,250,246,.06);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.swipe-back svg{width:17px;height:17px;}
.swipe-counter{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(251,250,246,.55);margin-left:auto;}
.expo-pills{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;flex:0 0 auto;-webkit-overflow-scrolling:touch;}
.expo-pills::-webkit-scrollbar{display:none;}
.expo-pill{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid rgba(251,250,246,.22);background:transparent;color:rgba(251,250,246,.75);font-size:12px;letter-spacing:.03em;white-space:nowrap;}
.expo-pill.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.swipe-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:4px 16px 18px;overflow:hidden;min-height:0;}
.swipe-card{position:absolute;width:min(420px,92%);height:100%;max-height:640px;border-radius:14px;overflow:hidden;background:#161208;box-shadow:0 20px 50px rgba(0,0,0,.45);touch-action:none;user-select:none;}
.swipe-card.dragging{transition:none;}
.swipe-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.swipe-card .noimg{height:100%;display:flex;align-items:center;justify-content:center;color:rgba(251,250,246,.4);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.swipe-card .overlay-grad{position:absolute;left:0;right:0;bottom:0;padding:20px 18px 18px;background:linear-gradient(to top, rgba(10,8,4,.92), rgba(10,8,4,.5) 60%, transparent);}
.swipe-card .s-title{font-size:22px;margin:0 0 2px;color:var(--paper);}
.swipe-card .s-artist{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-pale);margin:0 0 8px;font-weight:600;}
.swipe-card .s-row{display:flex;align-items:center;gap:8px;}
.swipe-card .s-row .price{color:var(--paper);}
.swipe-info-btn{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(10,8,4,.55);color:var(--paper);border:1px solid rgba(251,250,246,.25);display:flex;align-items:center;justify-content:center;z-index:2;}
.swipe-info-btn svg{width:17px;height:17px;}
.swipe-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(251,250,246,.08);border:1px solid rgba(251,250,246,.2);color:var(--paper);display:flex;align-items:center;justify-content:center;z-index:3;}
.swipe-nav.prev{left:2px;} .swipe-nav.next{right:2px;}
.swipe-nav svg{width:18px;height:18px;}
.swipe-sheet{position:absolute;left:0;right:0;bottom:0;top:32%;background:rgba(12,10,6,.97);border-radius:14px 14px 0 0;padding:20px 20px 26px;transform:translateY(100%);transition:transform .25s ease;overflow-y:auto;z-index:2;}
.swipe-sheet.open{transform:translateY(0);}
.swipe-sheet h3{margin:0 0 4px;}
.swipe-sheet .s-specs{list-style:none;margin:14px 0;padding:0;font-size:13px;}
.swipe-sheet .s-specs li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(251,250,246,.1);color:rgba(251,250,246,.85);}
.swipe-sheet .s-specs li span:first-child{color:rgba(251,250,246,.5);}
.swipe-empty{color:rgba(251,250,246,.6);text-align:center;padding:40px 24px;font-size:14px;}

/* ---------- Modal / overlay base ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(28,24,16,0.55);
  display:flex;align-items:flex-start;justify-content:center;
  padding:26px 16px;overflow-y:auto;
}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  width:100%;box-shadow:var(--shadow);
  animation:panelin .18s ease both;
}
@keyframes panelin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.panel-narrow{max-width:400px;}
.panel-form{max-width:640px;}
.panel-wide{max-width:980px;}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--line);
}
.panel-head h2{margin:0;font-size:19px;font-weight:500;}
.panel-body{padding:22px;}
.panel-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.closex{background:none;border:none;color:var(--ink-soft);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.closex:hover{background:var(--paper-alt);color:var(--ink);}
.closex svg{width:16px;height:16px;}

/* forms */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.formgrid .span2{grid-column:1/-1;}
.formfield label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
.formfield input,.formfield select,.formfield textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;
  background:var(--paper);font-size:14px;color:var(--ink);
}
.formfield input:focus,.formfield select:focus,.formfield textarea:focus{border-color:var(--gold);}
.formfield textarea{resize:vertical;min-height:64px;}
.pricerow{display:flex;gap:8px;}
.pricerow select{max-width:78px;flex:0 0 auto;}
.reqstar{color:var(--gold-deep);}
.err-text{color:#8a4a3d;font-size:12px;margin-top:10px;}

.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:8px;}
.pthumb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pthumb .pctl{position:absolute;inset:0;background:rgba(0,0,0,0.35);opacity:0;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .12s;}
.pthumb:hover .pctl{opacity:1;}
.pthumb .pctl button{width:24px;height:24px;border-radius:50%;border:none;background:#fff;display:flex;align-items:center;justify-content:center;}
.pthumb .pctl svg{width:12px;height:12px;}
.addphoto{
  aspect-ratio:1;border:1.5px dashed var(--line);border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink-soft);font-size:10px;text-align:center;background:transparent;
}
.addphoto:hover{border-color:var(--gold);color:var(--gold-deep);}
.addphoto svg{width:18px;height:18px;}

/* ---------- Lightbox / detail ---------- */
.detail-body{display:grid;grid-template-columns:1.15fr 1fr;gap:0;}
.detail-media{background:var(--paper-alt);padding:22px;}
.stagewrap{position:relative;aspect-ratio:4/5;overflow:auto;background:var(--ink);border-radius:2px;}
.stagewrap img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;transition:transform .25s ease;transform-origin:center;background:#111;}
.stagewrap img.zoomed{cursor:zoom-out;transform:scale(2.1);}
.stage-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(251,250,246,.85);border:none;display:flex;align-items:center;justify-content:center;}
.stage-nav svg{width:16px;height:16px;}
.stage-prev{left:8px;}
.stage-next{right:8px;}
.thumbstrip{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px;}
.thumbstrip button{flex:0 0 56px;height:56px;padding:0;border-radius:2px;border:2px solid transparent;overflow:hidden;background:none;}
.thumbstrip button.active{border-color:var(--gold);}
.thumbstrip img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-info{padding:26px 26px 22px;}
.detail-info .eyebrow{margin-bottom:6px;}
.detail-info h2{font-size:26px;margin:0 0 4px;font-weight:500;line-height:1.15;}
.detail-info .artist{font-size:14px;color:var(--gold-deep);font-weight:600;margin:0 0 16px;}
.specs{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line);}
.specs li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.specs li span:first-child{color:var(--ink-soft);}
.detail-price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.detail-price-row .price{font-size:20px;}
.detail-notes{font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}

/* ---------- Price list ---------- */
.plist-controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:18px 22px;border-bottom:1px solid var(--line);}
#priceSheet{padding:34px 40px;max-width:820px;margin:0 auto;}
.plist-header{text-align:center;margin-bottom:6px;}
.plist-header .logo-mark{width:44px;height:44px;margin:0 auto 8px;}
.plist-header h1{font-size:24px;margin:0;font-weight:600;}
.plist-header .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
.plist-date{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:6px 0 26px;}
.expo-group{margin-bottom:30px;}
.expo-group h3{font-size:16px;font-weight:600;border-bottom:1.5px solid var(--gold);padding-bottom:6px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;}
.expo-group .expo-date{font-size:11px;color:var(--ink-soft);font-weight:400;text-transform:uppercase;letter-spacing:.06em;}
.plist-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px dotted var(--line);font-size:13px;align-items:flex-start;}
.plist-row .thumb{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:var(--paper-alt);}
.plist-row .thumb-placeholder{width:72px;height:72px;border-radius:6px;flex:0 0 auto;background:var(--paper-alt);display:flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.3;}
.plist-row .body{flex:1;min-width:0;}
.plist-row .body .t{font-weight:600;}
.plist-row .body .m{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.plist-row .body .notes{color:var(--ink-soft);font-size:11.5px;margin-top:5px;font-style:italic;}
.plist-row .r{white-space:nowrap;font-weight:600;text-align:right;flex:0 0 auto;padding-left:8px;}
.plist-row .r.soldtxt{color:var(--ink-soft);font-weight:600;font-style:italic;}
.plist-empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}

/* ---------- pin modal ---------- */
.pindots{display:flex;gap:10px;justify-content:center;margin:18px 0;}
.pindots input{width:100%;text-align:center;letter-spacing:.5em;font-size:22px;padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--paper);}

/* ---------- misc ---------- */
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:3px;
  font-size:13px;z-index:200;box-shadow:var(--shadow);animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .detail-body{grid-template-columns:1fr;}
  .formgrid{grid-template-columns:1fr;}
  .admin-strip{margin-left:0;width:100%;justify-content:flex-start;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .searchwrap{max-width:none;}
}

@media print{
  body *{visibility:hidden;}
  #priceSheet,#priceSheet *{visibility:visible;}
  #priceSheet{position:absolute;top:0;left:0;width:100%;padding:0;}
  .no-print{display:none !important;}
  .overlay{position:absolute;background:none;padding:0;}
  .panel{box-shadow:none;border:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important;}
}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <div class="logo-mark">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,4 91,27 91,73 50,96 9,73 9,27" stroke="#A97D40" stroke-width="2.4"/>
        <polygon points="50,20 78,36 78,64 50,80 22,64 22,36" stroke="#A97D40" stroke-width="1.3" opacity=".7"/>

        <path d="M50 37 L54 50 L50 63 L46 50 Z" fill="#A97D40" opacity=".9"/>

<script>
(function(){
"use strict";

const CURRENCY_SYM = {EUR:'€',USD:'$',GBP:'£'};
const STATUS = {
  available:{label:'Available',cls:'badge-available'},
  reserved:{label:'Reserved',cls:'badge-reserved'},
  sold:{label:'Sold',cls:'badge-sold'},
  nfs:{label:'Not for sale',cls:'badge-nfs'}
};

const state = {
  artworks: [],
  expos: [],
  artists: [],
  filter: {expo:'all', status:'all', q:''},
  swipe: {expoId:'all', index:0},
  isAdmin: false,
  loading: true,
  error: null
};

const $ = sel => document.querySelector(sel);
const galleryRoot = $('#galleryRoot');
const modalRoot = $('#modalRoot');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function money(price, currency){
  if(price===''||price==null||isNaN(price)) return '—';
  const sym = CURRENCY_SYM[currency]||currency||'';
  return sym + Number(price).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function hexDivider(){
  return '<div class="divider-hex"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="50,4 91,27 91,73 50,96 9,73 9,27" stroke="#A97D40" stroke-width="6"/></svg></div>';
}

/* ---------------- storage layer (on-device, IndexedDB) ---------------- */
// Everything is stored locally in this browser's IndexedDB — nothing leaves the phone,
// and nothing depends on a network connection. The get/set/delete/list function names
// and shapes match the original cloud version so the rest of the app didn't need to change;
// the "shared" argument is accepted but ignored since there's only one device now.
const DB_NAME = 'sais-db', DB_STORE = 'kv';
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE, {keyPath:'key'}); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _dbPromise;
}
async function sGet(key){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readonly');
      const r = tx.objectStore(DB_STORE).get(key);
      r.onsuccess = ()=>resolve(r.result ? r.result.value : null);
      r.onerror = ()=>reject(r.error);
    });
  }catch(e){ console.error('storage get failed for', key, e); return null; }
}
async function sSet(key, value){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({key, value});
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error('storage set failed for', key, e); return false; }
}
async function sDelete(key){
  try{
    const db = await openDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error('storage delete failed for', key, e); }
}
async function sList(prefix){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).getAllKeys();
      req.onsuccess = ()=>resolve(req.result.filter(k=>k.startsWith(prefix)));
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ console.error('storage list failed for', prefix, e); return []; }
}

async function loadExpos(){
  const v = await sGet('sais:expos', true);
  return v ? JSON.parse(v) : [];
}
async function saveExpos(){
  return await sSet('sais:expos', JSON.stringify(state.expos), true);
}
async function loadArtists(){
  const v = await sGet('sais:artists', true);
  return v ? JSON.parse(v) : [];
}
async function saveArtists(){
  return await sSet('sais:artists', JSON.stringify(state.artists), true);
}
async function loadArtworks(){
  const keys = await sList('sais:artwork:', true);
  const metas = (await Promise.all(keys.map(k=>sGet(k, true))))
    .filter(Boolean).map(v=>{ try{return JSON.parse(v);}catch(e){return null;} }).filter(Boolean);
  // Photos are stored one-per-key (see saveArtwork) so stitch them back onto each artwork.
  await Promise.all(metas.map(async m=>{
    const n = m.photoCount||0;
    const photoKeys = [];
    for(let i=0;i<n;i++) photoKeys.push('sais:photo:'+m.id+':'+i);
    const vals = await Promise.all(photoKeys.map(k=>sGet(k, true)));
    m.photos = vals.filter(Boolean);
    delete m.photoCount;
  }));
  return metas;
}
async function saveArtwork(art){
  // Each photo is saved under its own storage key instead of embedding all of them inside
  // the artwork record. A record with a few photos easily passed the 5MB-per-key storage
  // limit as one blob, which is what was causing "could not save" on adding artwork.
  const photos = art.photos||[];
  try{
    const existingKeys = await sList('sais:photo:'+art.id+':', true);
    const keepKeys = photos.map((_,i)=>'sais:photo:'+art.id+':'+i);
    const staleKeys = existingKeys.filter(k=>!keepKeys.includes(k));
    for(const k of staleKeys){ await sDelete(k, true); }

    // Saved one at a time (not Promise.all): firing every photo save at once can trip the
    // storage rate limit and fail one of them intermittently.
    for(let i=0;i<photos.length;i++){
      const ok = await sSet('sais:photo:'+art.id+':'+i, photos[i], true);
      if(!ok) return {ok:false, reason:'photo', photoIndex:i};
    }

    const meta = {...art, photoCount: photos.length};
    delete meta.photos;
    const metaOk = await sSet('sais:artwork:'+art.id, JSON.stringify(meta), true);
    return {ok: metaOk, reason: metaOk?null:'meta'};
  }catch(e){
    console.error('saveArtwork failed', e);
    return {ok:false, reason:'error'};
  }
}
async function deleteArtworkStorage(id){
  const keys = await sList('sais:photo:'+id+':', true);
  await Promise.all(keys.map(k=>sDelete(k, true)));
  await sDelete('sais:artwork:'+id, true);
}
async function getAdminPin(){ return await sGet('sais:admin-pin', true); }
async function setAdminPinStorage(pin){ await sSet('sais:admin-pin', pin, true); }

/* ---------------- image compression ---------------- */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1600; quality = quality||0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        // Keep shrinking until the encoded photo is comfortably under the 5MB-per-key
        // storage limit. Detailed/grainy art photos can stay large even after one pass
        // of compression, which is what was making individual photo saves fail.
        const targetChars = 1.4*1024*1024;
        let dim = maxDim, q = quality, dataUrl;
        for(let attempt=0; attempt<6; attempt++){
          let w = img.width, h = img.height;
          if(w>h){ if(w>dim){h=Math.round(h*dim/w); w=dim;} }
          else { if(h>dim){w=Math.round(w*dim/h); h=dim;} }
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          dataUrl = canvas.toDataURL('image/jpeg', q);
          if(dataUrl.length <= targetChars || (dim<=700 && q<=0.45)) break;
          if(q>0.45) q = Math.max(0.45, +(q-0.15).toFixed(2));
          else dim = Math.max(700, Math.round(dim*0.8));
        }
        resolve(dataUrl);
      };
      img.onerror = ()=>reject(new Error('image decode failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---------------- init ---------------- */
async function init(){
  render();
  try{
    const [expos, artworks, artists, remembered] = await Promise.all([loadExpos(), loadArtworks(), loadArtists(), sGet('sais:admin-remembered')]);
    state.expos = expos;
    state.artworks = artworks;
    state.artists = artists;
    if(remembered==='true') state.isAdmin = true;
    state.loading = false;
  }catch(e){
    state.loading = false;
    state.error = 'Could not load the gallery from this device. Try reloading the app.';
  }
  renderFilterOptions();
  render();
}

function sortedExpos(){
  return [...state.expos].sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
}
function sortedArtists(){
  return [...state.artists].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
function sortedArtworksFor(list){
  return [...list].sort((a,b)=>(a.order||0)-(b.order||0) || (a.title||'').localeCompare(b.title||''));
}
function expoById(id){ return state.expos.find(x=>x.id===id); }
function artistById(id){ return state.artists.find(x=>x.id===id); }

function renderFilterOptions(){
  const sel = $('#filterExpo');
  const cur = sel.value || 'all';
  sel.innerHTML = '<option value="all">All collections</option>' +
    sortedExpos().map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  sel.value = [...sel.options].some(o=>o.value===cur) ? cur : 'all';
}

/* ---------------- gallery render ---------------- */
function filteredArtworks(){
  const {expo, status, q} = state.filter;
  return state.artworks.filter(a=>{
    if(expo!=='all' && a.expoId!==expo) return false;
    if(status!=='all' && a.status!==status) return false;
    if(q){
      const hay = (a.title+' '+a.artist).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  });
}

function render(){
  $('#adminStrip').style.display = state.isAdmin ? 'flex' : 'none';
  $('#lockIcon').innerHTML = state.isAdmin
    ? '<rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0"/>'
    : '<rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
  $('#adminBtn').classList.toggle('active', state.isAdmin);

  if(state.loading){
    galleryRoot.innerHTML = `<div class="state-msg"><div class="spinner"></div><p>Loading the gallery…</p></div>`;
    return;
  }
  if(state.error){
    galleryRoot.innerHTML = `<div class="state-msg"><h3>Something went wrong</h3><p>${esc(state.error)}</p></div>`;
    return;
  }
  const list = sortedArtworksFor(filteredArtworks());
  if(list.length===0){
    galleryRoot.innerHTML = state.artworks.length===0
      ? `<div class="state-msg"><h3>The gallery is empty</h3><p>${state.isAdmin ? 'Add your first artwork to get started.' : 'Nothing has been added to this gallery yet.'}</p>${state.isAdmin?'<button class="btn btn-solid" onclick="SAIS.openArtworkForm()">+ Add artwork</button>':''}</div>`
      : `<div class="state-msg"><h3>No works match your filters</h3><p>Try a different collection, status, or search term.</p></div>`;
    return;
  }
  galleryRoot.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}

function cardHTML(a, i){
  const cover = a.photos && a.photos[0];
  const st = STATUS[a.status] || STATUS.available;
  const priceOrStatus = a.status==='sold'
    ? `<span class="badge ${st.cls}">${st.label}</span>`
    : (a.status==='nfs'
        ? `<span class="badge ${st.cls}">${st.label}</span>`
        : `<span class="price">${esc(money(a.price,a.currency))}</span><span class="badge ${st.cls}" style="margin-left:6px;">${st.label}</span>`);
  return `
  <div class="card">
    <div class="imgwrap" onclick="SAIS.openDetail('${a.id}')" role="button" tabindex="0">
      ${cover ? `<img src="${cover}" alt="${esc(a.title)}" loading="lazy">` : `<div class="noimg">No photo</div>`}
      ${a.catalogNo ? `<span class="catno">${esc(a.catalogNo)}</span>` : ''}
      ${state.isAdmin ? `
        <div class="admin-card-controls">
          <button title="Edit" onclick="event.stopPropagation();SAIS.openArtworkForm('${a.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button title="Delete" onclick="event.stopPropagation();SAIS.confirmDeleteArtwork('${a.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </div>` : ''}
    </div>
    <div class="info">
      <p class="title">${esc(a.title)||'Untitled'}</p>
      <p class="artist">${esc(a.artist)||'Unknown artist'}</p>
      <p class="meta">${[a.year, a.material].filter(Boolean).map(esc).join(' · ')}</p>
      <div class="bottomrow">${priceOrStatus}</div>
    </div>
  </div>`;
}

/* ---------------- modal helpers ---------------- */
function openOverlay(html, opts){
  opts = opts||{};
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = html;
  wrap.addEventListener('mousedown', e=>{ if(e.target===wrap && !opts.persistent) closeOverlay(wrap); });
  modalRoot.appendChild(wrap);
  document.body.style.overflow='hidden';
  const escHandler = e=>{ if(e.key==='Escape' && !opts.persistent){ closeOverlay(wrap); } };
  wrap._escHandler = escHandler;
  document.addEventListener('keydown', escHandler);
  return wrap;
}
function closeOverlay(wrap){
  if(!wrap) return;
  document.removeEventListener('keydown', wrap._escHandler);
  wrap.remove();
  if(!modalRoot.children.length) document.body.style.overflow='';
}
function closeAllOverlays(){ modalRoot.innerHTML=''; document.body.style.overflow=''; }

/* ---------------- admin unlock ---------------- */
async function handleAdminClick(){
  if(state.isAdmin){
    state.isAdmin = false;
    render();
    toast('Editing locked');
    return;
  }
  const existingPin = await getAdminPin();
  if(!existingPin){
    openSetPinModal();
  } else {
    openEnterPinModal(existingPin);
  }
}

function openSetPinModal(){
  const wrap = openOverlay(`
    <div class="panel panel-narrow">
      <div class="panel-head"><h2>Set an admin PIN</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="panel-body">
        <p class="hint">Choose a 4-digit PIN to protect editing. Anyone with this PIN can add, edit, or delete artworks.</p>
        <div class="pindots"><input type="password" inputmode="numeric" maxlength="8" id="newPinInput" placeholder="••••"></div>
        <p class="hint" id="pinErr" style="color:#8a4a3d;"></p>
        <div class="checkline" style="margin-top:14px;">
          <input type="checkbox" id="rememberDeviceChk" checked>
          <label for="rememberDeviceChk">Remember this device — skip the PIN next time you open the app here</label>
        </div>
      </div>
      <div class="panel-foot">
        <button class="btn btn-plain" data-close>Cancel</button>
        <button class="btn btn-solid" id="savePinBtn">Set PIN</button>
      </div>
    </div>`);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));
  wrap.querySelector('#savePinBtn').onclick = async ()=>{
    const val = wrap.querySelector('#newPinInput').value.trim();
    if(val.length<4){ wrap.querySelector('#pinErr').textContent='PIN must be at least 4 characters.'; return; }
    await setAdminPinStorage(val);
    if(wrap.querySelector('#rememberDeviceChk').checked) await sSet('sais:admin-remembered', 'true');
    state.isAdmin = true;
    closeOverlay(wrap);
    render();
    toast('Editing unlocked');
  };
}
function openEnterPinModal(pin){
  const wrap = openOverlay(`
    <div class="panel panel-narrow">
      <div class="panel-head"><h2>Enter admin PIN</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="panel-body">
        <div class="pindots"><input type="password" inputmode="numeric" maxlength="8" id="pinInput" placeholder="••••"></div>
        <p class="hint" id="pinErr" style="color:#8a4a3d;"></p>
        <div class="checkline" style="margin-top:14px;">
          <input type="checkbox" id="rememberDeviceChk" checked>
          <label for="rememberDeviceChk">Remember this device — skip the PIN next time you open the app here</label>
        </div>
      </div>
      <div class="panel-foot">
        <button class="btn btn-plain" data-close>Cancel</button>
        <button class="btn btn-solid" id="checkPinBtn">Unlock</button>
      </div>
    </div>`);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));
  const input = wrap.querySelector('#pinInput');
  const tryUnlock = async ()=>{
    if(input.value===pin){
      if(wrap.querySelector('#rememberDeviceChk').checked) await sSet('sais:admin-remembered', 'true');
      state.isAdmin = true;
      closeOverlay(wrap);
      render();
      toast('Editing unlocked');
    } else {
      wrap.querySelector('#pinErr').textContent = 'Incorrect PIN.';
    }
  };
  wrap.querySelector('#checkPinBtn').onclick = tryUnlock;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  setTimeout(()=>input.focus(), 50);
}
function xIcon(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

/* ---------------- artwork detail (lightbox) ---------------- */
function openDetail(id){
  const a = state.artworks.find(x=>x.id===id);
  if(!a) return;
  let idx = 0;
  const photos = (a.photos && a.photos.length) ? a.photos : [];
  const st = STATUS[a.status]||STATUS.available;

  const wrap = openOverlay(`
    <div class="panel panel-wide">
      <div class="panel-head"><h2 class="serif">${esc(a.title)||'Untitled'}</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="detail-body">
        <div class="detail-media">
          <div class="stagewrap">
            ${photos.length ? `<img id="stageImg" src="${photos[0]}">` : `<div class="noimg" style="color:#eee;">No photo</div>`}
            ${photos.length>1 ? `
              <button class="stage-nav stage-prev" id="prevPhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button class="stage-nav stage-next" id="nextPhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            ` : ''}
          </div>
          ${photos.length>1 ? `<div class="thumbstrip" id="thumbstrip">${photos.map((p,i)=>`<button class="${i===0?'active':''}" data-i="${i}"><img src="${p}"></button>`).join('')}</div>` : ''}
        </div>
        <div class="detail-info">
          <p class="eyebrow">${esc(expoById(a.expoId)?.name || '')}</p>
          <h2>${esc(a.title)||'Untitled'}</h2>
          <p class="artist">${esc(a.artist)||'Unknown artist'}</p>
          <div class="detail-price-row">
            ${a.status==='sold'||a.status==='nfs' ? `<span class="badge ${st.cls}">${st.label}</span>` : `<span class="price">${esc(money(a.price,a.currency))}</span>`}
            ${(a.status!=='sold'&&a.status!=='nfs') ? `<span class="badge ${st.cls}">${st.label}</span>` : ''}
          </div>
          <ul class="specs">
            ${a.year?`<li><span>Year</span><span>${esc(a.year)}</span></li>`:''}
            ${a.material?`<li><span>Material</span><span>${esc(a.material)}</span></li>`:''}
            ${a.measurements?`<li><span>Measurements</span><span>${esc(a.measurements)}</span></li>`:''}
          </ul>
          ${a.notes?`<div class="detail-notes">${esc(a.notes)}</div>`:''}
          <button class="btn btn-plain" id="shareCardBtn" style="margin-top:16px;width:auto;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4"/></svg>
            Share this artwork
          </button>
        </div>
      </div>

/* ---------------- share artwork card ---------------- */
function loadImagePromise(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('image load failed'));
    img.src = src;
  });
}
function drawImageCover(ctx, img, x, y, w, h){
  const imgRatio = img.width/img.height, boxRatio = w/h;
  let sx=0, sy=0, sw=img.width, sh=img.height;
  if(imgRatio > boxRatio){
    sw = img.height*boxRatio; sx = (img.width-sw)/2;
  } else {
    sh = img.width/boxRatio; sy = (img.height-sh)/2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
async function buildShareCardCanvas(a){
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FBFAF6'; ctx.fillRect(0,0,W,H);

  const photoH = Math.round(H*0.66);
  const cover = a.photos && a.photos[0];
  if(cover){
    try{
      const img = await loadImagePromise(cover);
      drawImageCover(ctx, img, 0, 0, W, photoH);
    }catch(e){
      ctx.fillStyle = '#F3F0E8'; ctx.fillRect(0,0,W,photoH);
    }
  } else {
    ctx.fillStyle = '#F3F0E8'; ctx.fillRect(0,0,W,photoH);
    ctx.fillStyle = '#6B6152'; ctx.font = '30px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('No photo available', W/2, photoH/2);
  }

  ctx.strokeStyle = '#A97D40'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(60, photoH+36); ctx.lineTo(W-60, photoH+36); ctx.stroke();

  let y = photoH + 96;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#221D14';
  ctx.font = '600 52px Fraunces, Georgia, serif';
  const titleLines = wrapTextCapped(ctx, a.title||'Untitled', 60, y, W-120, 58, 3);
  y += titleLines * 58 + 18;

  ctx.fillStyle = '#A97D40';
  ctx.font = '700 28px Inter, sans-serif';
  ctx.fillText((a.artist||'Unknown artist').toUpperCase(), 60, y);
  y += 54;

  ctx.fillStyle = '#6B6152';
  ctx.font = '30px Inter, sans-serif';
  const specifics = [a.year, a.material, a.measurements].filter(Boolean).join('   ·   ');
  if(specifics){ ctx.fillText(specifics, 60, y); y += 60; }

  const st = STATUS[a.status] || STATUS.available;
  ctx.fillStyle = '#221D14';
  ctx.font = '700 46px Inter, sans-serif';
  const priceText = (a.status==='sold'||a.status==='nfs') ? st.label : money(a.price, a.currency);
  ctx.fillText(priceText, 60, y);

  return canvas;
}
function wrapTextCapped(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for(const word of words){
    const test = line ? line+' '+word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);

  let shown = lines;
  if(lines.length > maxLines){
    shown = lines.slice(0, maxLines);
    let last = shown[maxLines-1];
    while(ctx.measureText(last+'…').width > maxWidth && last.length>0){
      last = last.slice(0, -1);
    }
    shown[maxLines-1] = last.replace(/\s+$/,'') + '…';
  }
  shown.forEach((ln,i)=>ctx.fillText(ln, x, y+i*lineHeight));
  return shown.length;
}
async function shareArtworkCard(a, btn){
  const originalText = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const canvas = await buildShareCardCanvas(a);
    const blob = await new Promise(resolve=>canvas.toBlob(resolve, 'image/png', 0.95));
    if(!blob) throw new Error('canvas export failed');
    const fileName = 'artwork-' + (a.title||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40) + '.png';
    const file = new File([blob], fileName, {type:'image/png'});
    const shareText = `${a.title||'Untitled'} — ${a.artist||'Unknown artist'}`;

    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:a.title||'Artwork', text:shareText});
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = fileName;
      document.body.appendChild(link); link.click(); link.remove();
      URL.revokeObjectURL(url);
      toast('Image downloaded — attach it to your message.');
    }
  }catch(err){
    if(err && err.name!=='AbortError'){
      console.error('shareArtworkCard failed', err);
      toast('Could not share — try again.');
    }
  }
  if(btn){ btn.disabled = false; btn.innerHTML = originalText; }
}

let swipeCardCleanup = null;
function swipeArtworks(){
  const list = state.swipe.expoId==='all' ? state.artworks : state.artworks.filter(a=>a.expoId===state.swipe.expoId);
  return sortedArtworksFor(list);
}
function openSwipeView(){
  state.swipe = {expoId:'all', index:0};
  const el = document.createElement('div');
  el.className = 'swipe-screen';
  el.id = 'swipeScreen';
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', swipeKeyHandler);
  renderSwipeScreen();
}
function closeSwipeView(){
  if(swipeCardCleanup){ swipeCardCleanup(); swipeCardCleanup=null; }
  const el = document.getElementById('swipeScreen');
  if(el) el.remove();
  document.body.style.overflow = '';
  document.removeEventListener('keydown', swipeKeyHandler);
}
function swipeKeyHandler(e){
  if(e.key==='Escape'){ closeSwipeView(); return; }
  if(e.key==='ArrowRight') swipeAdvance(1);
  if(e.key==='ArrowLeft') swipeAdvance(-1);
}
function swipeAdvance(dir){
  const list = swipeArtworks();
  if(!list.length) return;
  state.swipe.index = (state.swipe.index + dir + list.length) % list.length;
  renderSwipeScreen();
}
function renderSwipeScreen(){
  const el = document.getElementById('swipeScreen');
  if(!el) return;
  if(swipeCardCleanup){ swipeCardCleanup(); swipeCardCleanup=null; }
  const list = swipeArtworks();
  if(state.swipe.index >= list.length) state.swipe.index = Math.max(0, list.length-1);
  const a = list[state.swipe.index];
  const total = list.length;

  el.innerHTML = `
    <div class="swipe-top">
      <button class="swipe-back" id="swipeCloseBtn">${xIcon()}</button>

    </div>
    <div class="swipe-stage" id="swipeStage">
      ${total ? swipeCardHTML(a) : '<p class="swipe-empty">No artworks in this collection yet.</p>'}
      ${total>1 ? `
        <button class="swipe-nav prev" id="swipePrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="swipe-nav next" id="swipeNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
      ` : ''}
    </div>`;

  el.querySelector('#swipeCloseBtn').onclick = closeSwipeView;
  el.querySelectorAll('.expo-pill').forEach(b=>b.onclick=()=>{
    state.swipe.expoId = b.dataset.expo;

function wireCardDrag(el){
  const card = el.querySelector('#swipeCard');
  if(!card) return;
  const infoBtn = el.querySelector('#swipeInfoBtn');
  const sheet = el.querySelector('#swipeSheet');
  let sheetOpen = false;
  infoBtn.onclick = ()=>{ sheetOpen = !sheetOpen; sheet.classList.toggle('open', sheetOpen); };

  let dragging=false, startX=0, startY=0, dx=0;
  function onDown(e){
    if(sheetOpen) return;
    dragging = true; dx = 0;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    card.classList.add('dragging');
  }
  function onMove(e){
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    dx = p.clientX - startX;
    const dy = p.clientY - startY;
    if(Math.abs(dy) > Math.abs(dx)*1.5) return;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    const threshold = 90;
    if(dx > threshold) flyOut(1);
    else if(dx < -threshold) flyOut(-1);
    else card.style.transform = '';
  }
  function flyOut(dir){
    card.style.transition = 'transform .3s ease, opacity .3s ease';
    card.style.transform = `translateX(${dir*700}px) rotate(${dir*20}deg)`;
    card.style.opacity = '0';
    setTimeout(()=>swipeAdvance(dir), 200);
  }
  card.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  swipeCardCleanup = ()=>{
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
}

    toast('Artwork deleted');

}

function openExpoManager(){
  const wrap = openOverlay(`
    <div class="panel panel-form">
      <div class="panel-head"><h2>Collections</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="panel-body">
        <div id="expoList"></div>
        <div class="divider-hex" style="margin:22px 0 18px;">${hexDivider().replace(/<div[^>]*>|<\/div>/g,'')}</div>
        <p class="eyebrow" style="margin-bottom:10px;">Add a collection</p>
        <div class="formgrid">
          <div class="formfield"><label>Name</label><input id="newExpoName" type="text" placeholder="e.g. Spring Salon 2026"></div>
          <div class="formfield"><label>Date <span style="text-transform:none;">(optional)</span></label><input id="newExpoDate" type="text" placeholder="e.g. 12–28 Sept 2026"></div>
        </div>
        <button class="btn btn-solid" style="margin-top:12px;" id="addExpoBtn">+ Add collection</button>
      </div>
      <div class="panel-foot"><button class="btn btn-plain" data-close>Close</button></div>
    </div>`, {persistent:true});
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));

  function renderList(){
    const list = wrap.querySelector('#expoList');
    const sorted = sortedExpos();
    if(!sorted.length){ list.innerHTML = '<p class="hint">No collections yet.</p>'; return; }
    list.innerHTML = sorted.map((x,i)=>`
      <div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13.5px;">${esc(x.name)}</div>
          ${x.date?`<div class="hint" style="margin-top:0;">${esc(x.date)}</div>`:''}
        </div>
        <button class="iconbtn" data-up="${x.id}" title="Move up" ${i===0?'disabled':''} style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="iconbtn" data-down="${x.id}" title="Move down" ${i===sorted.length-1?'disabled':''} style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="iconbtn" data-editexpo="${x.id}" title="Edit" style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="iconbtn" data-docs="${x.id}" title="Documents" style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>${(x.docs&&x.docs.length)?`<span class="doc-count">${x.docs.length}</span>`:''}</button>
        <button class="iconbtn" data-delexpo="${x.id}" title="Delete" style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
      </div>`).join('');

    list.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>swapOrder(b.dataset.up,-1));
    list.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>swapOrder(b.dataset.down,1));
    list.querySelectorAll('[data-delexpo]').forEach(b=>b.onclick=()=>delExpo(b.dataset.delexpo));
    list.querySelectorAll('[data-editexpo]').forEach(b=>b.onclick=()=>editExpo(b.dataset.editexpo));
    list.querySelectorAll('[data-docs]').forEach(b=>b.onclick=()=>openDocsPanel(b.dataset.docs, renderList));
  }
  async function swapOrder(id, dir){
    const sorted = sortedExpos();
    const i = sorted.findIndex(x=>x.id===id);
    const j = i+dir;
    if(j<0||j>=sorted.length) return;
    const prevOrders = sorted.map(x=>x.order);
    sorted.forEach((x,k)=>x.order=k);
    const tmp = sorted[i].order; sorted[i].order=sorted[j].order; sorted[j].order=tmp;
    state.expos = sorted;
    const ok = await saveExpos();
    if(!ok){
      sorted.forEach((x,k)=>x.order=prevOrders[k]);
      toast('Could not save the new order — try again.');
    }
    renderFilterOptions();
    renderList();
  }
  async function delExpo(id){
    const removed = state.expos.find(x=>x.id===id);
    const docCount = (removed.docs||[]).length;
    const warning = docCount
      ? `Delete this collection? Artworks in it will keep their details but show no collection. This will also permanently delete ${docCount} attached document${docCount>1?'s':''}.`
      : 'Delete this collection? Artworks in it will keep their details but show no collection.';
    if(!confirm(warning)) return;
    const affected = state.artworks.filter(a=>a.expoId===id);
    state.expos = state.expos.filter(x=>x.id!==id);
    affected.forEach(a=>{ a.expoId=''; });
    const ok = await saveExpos();
    if(!ok){
      state.expos.push(removed);
      affected.forEach(a=>{ a.expoId=id; });
      toast('Could not delete the collection — try again.');
      renderFilterOptions();
      renderList();
      return;
    }
    const docKeys = await sList('sais:doc:'+id+':');
    for(const k of docKeys){ await sDelete(k); }
    renderFilterOptions();
    renderList();
    render();
  }
  async function editExpo(id){
    const x = expoById(id);
    const name = prompt('Collection name:', x.name);
    if(name===null) return;
    const date = prompt('Date (optional):', x.date||'');
    const prevName = x.name, prevDate = x.date;
    x.name = name.trim()||x.name;
    x.date = (date||'').trim();
    const ok = await saveExpos();
    if(!ok){
      x.name = prevName; x.date = prevDate;
      toast('Could not save changes — try again.');
    }
    renderFilterOptions();
    renderList();
    render();
  }
  wrap.querySelector('#addExpoBtn').onclick = async ()=>{
    const name = wrap.querySelector('#newExpoName').value.trim();
    if(!name){ toast('Give the collection a name first.'); return; }
    const date = wrap.querySelector('#newExpoDate').value.trim();
    const newExpo = {id:uid('expo'), name, date, venue:'', order: state.expos.length};
    state.expos.push(newExpo);
    const ok = await saveExpos();
    if(!ok){
      state.expos = state.expos.filter(x=>x.id!==newExpo.id);
      toast('Could not save the collection — your device may be low on storage. Try again.');
      return;
    }
    wrap.querySelector('#newExpoName').value='';
    wrap.querySelector('#newExpoDate').value='';
    renderFilterOptions();
    renderList();
  };
  renderList();
}

async function delArtist(id, onChange){
  const x = artistById(id);
  if(!x) return;
  const count = artworkCountFor(id);
  const warning = count
    ? `Delete ${x.name}? ${count} artwork${count===1?'':'s'} linked to them will keep their details but lose the link to this profile.`
    : `Delete ${x.name}?`;
  if(!confirm(warning)) return;
  const prevArtists = state.artists.slice();
  const affected = state.artworks.filter(a=>a.artistId===id);
  state.artists = state.artists.filter(x=>x.id!==id);
  affected.forEach(a=>{ a.artistId=''; });
  const ok = await saveArtists();
  if(!ok){
    state.artists = prevArtists;
    affected.forEach(a=>{ a.artistId=id; });
    toast('Could not delete — try again.');
    return;
  }
  if(typeof onChange==='function') onChange();
  render();
}

  const wrap = openOverlay(`

          </div>`).join('') || '<p class="hint">No artworks listed.</p>'}

        ${data.agreement && data.agreement.agreed ? `<p class="hint" style="margin-bottom:14px;">Agreement signed by ${esc(data.agreement.signedName||'')} on ${esc(data.agreement.signedDate||'')}.</p>` : `<p class="hint" style="margin-bottom:14px;color:var(--danger,#a33);">No signed agreement included in this submission.</p>`}

      </div>

  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));

  const expoSelect = wrap.querySelector('#importExpoSelect');
  expoSelect.addEventListener('change', async e=>{
    if(e.target.value==='__new__'){
      const name = prompt('New collection name:');
      if(name && name.trim()){
        const newExpo = {id: uid('expo'), name: name.trim(), date:'', venue:'', order: state.expos.length, docs:[]};
        state.expos.push(newExpo);
        const ok = await saveExpos();
        if(!ok){
          state.expos = state.expos.filter(x=>x.id!==newExpo.id);
          e.target.value = '';
          toast('Could not save the new collection — try again.');
          return;
        }
        const opt = document.createElement('option');
        opt.value = newExpo.id; opt.textContent = newExpo.name;
        expoSelect.insertBefore(opt, expoSelect.lastElementChild);
        expoSelect.value = newExpo.id;
      } else {
        e.target.value = '';
      }
    }
  });

  wrap.querySelector('#confirmImportBtn').onclick = async ()=>{
    const btn = wrap.querySelector('#confirmImportBtn');
    btn.disabled = true; btn.textContent = 'Importing…';

    let artist = existingMatch;
    if(artist){
      Object.assign(artist, {
        name: artistData.name || artist.name,
        dob: artistData.dob || artist.dob,
        birthCity: artistData.birthCity || artist.birthCity,
        email: artistData.email || artist.email,
        phone: artistData.phone || artist.phone,
        website: artistData.website || artist.website,
        favArtist: artistData.favArtist || artist.favArtist,
        dream: artistData.dream || artist.dream,
      });
    } else {
      artist = {
        id: uid('artist'), name: artistData.name||'Unnamed artist', dob: artistData.dob||'',
        birthCity: artistData.birthCity||'', email: artistData.email||'', phone: artistData.phone||'',
        website: artistData.website||'', favArtist: artistData.favArtist||'', dream: artistData.dream||'',
        notes:'', createdAt: new Date().toISOString()
      };
      state.artists.push(artist);
    }
    const artistOk = await saveArtists();
    if(!artistOk){
      toast('Could not save the artist profile — try again.');
      btn.disabled = false; btn.textContent = 'Import';
      return;
    }

    const expoId = expoSelect.value==='__new__' ? '' : expoSelect.value;
    let importedCount = 0;
    for(const w of artworks){
      const priceNum = w.price && !isNaN(parseFloat(w.price)) ? parseFloat(w.price) : '';
      const newArt = {
        id: uid('art'), title: w.title||'', artist: artist.name, artistId: artist.id,
        year: w.year||'', material: w.medium||'', measurements: w.dimensions||'',
        price: priceNum, currency:'EUR', status:'available', expoId,
        notes: data.notes||'', catalogNo:'', order: Date.now()+importedCount, photos:[]
      };
      const result = await saveArtwork(newArt);
      if(result.ok){ state.artworks.push(newArt); importedCount++; }
    }

    if(expoId){
      const expo = expoById(expoId);
      if(expo){
        if(!expo.docs) expo.docs = [];
        const docEntry = {id: uid('doc'), name: `${artist.name} — submission.json`, size: JSON.stringify(data).length, type:'application/json', uploadedAt: new Date().toISOString()};
        const fileOk = await sSet('sais:doc:'+expoId+':'+docEntry.id, 'data:application/json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))));
        if(fileOk){
          expo.docs.push(docEntry);
          await saveExpos();
        }
      }
    }

    renderFilterOptions();
    render();
    closeOverlay(wrap);
    toast(`Imported ${importedCount} artwork${importedCount===1?'':'s'} for ${artist.name}.`);
  };
}

/* ---------------- documents (per collection) ---------------- */
function fmtBytes(n){
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(0)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
function fmtDocDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return ''; }
}
const MAX_DOC_BYTES = 20 * 1024 * 1024; // 20MB soft cap per document

function openDocsPanel(expoId, onChange){
  const expo = expoById(expoId);
  if(!expo) return;
  if(!expo.docs) expo.docs = [];
  const wrap = openOverlay(`
    <div class="panel panel-form">
      <div class="panel-head"><h2>Documents — ${esc(expo.name)}</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="panel-body">
        <p class="hint" style="margin-bottom:16px;">Attach signed agreements or other files for this collection — a scanned PDF, a photo of a signed page, whatever you've got. These live on this device just like everything else, so keep the real signed original somewhere durable too (email, cloud drive); treat this as a handy copy, not the only copy.</p>
        <div id="docList"></div>
        <div class="divider-hex" style="margin:20px 0 16px;">${hexDivider().replace(/<div[^>]*>|<\/div>/g,'')}</div>
        <input type="file" id="docFileInput" accept="application/pdf,.pdf,image/*" style="display:none;">
        <button class="btn btn-solid" id="uploadDocBtn">+ Upload document</button>
        <p class="err-text" id="docErr" style="display:none;"></p>
      </div>
      <div class="panel-foot"><button class="btn btn-plain" data-close>Close</button></div>
    </div>`, {persistent:true});
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));

  function renderDocs(){
    const list = wrap.querySelector('#docList');
    const docs = expo.docs||[];
    if(!docs.length){ list.innerHTML = '<p class="hint">No documents attached yet.</p>'; return; }
    list.innerHTML = docs.map(d=>`
      <div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.name)}</div>
          <div class="hint" style="margin-top:0;">${fmtDocDate(d.uploadedAt)} · ${fmtBytes(d.size||0)}</div>
        </div>
        <button class="btn btn-plain" data-viewdoc="${d.id}" style="padding:6px 12px;font-size:12px;">View</button>
        <button class="iconbtn" data-deldoc="${d.id}" title="Delete" style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
      </div>`).join('');

    list.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewdoc));
    list.querySelectorAll('[data-deldoc]').forEach(b=>b.onclick=()=>deleteDoc(b.dataset.deldoc));
  }

  async function viewDoc(docId){
    const dataUrl = await sGet('sais:doc:'+expoId+':'+docId);
    if(!dataUrl){ toast('Could not load that document.'); return; }
    const win = window.open();
    if(win){ win.document.write(`<iframe src="${dataUrl}" style="border:0;position:fixed;inset:0;width:100%;height:100%;"></iframe>`); }
    else { toast('Please allow pop-ups to view the document.'); }
  }

  async function deleteDoc(docId){
    const d = expo.docs.find(x=>x.id===docId);
    if(!d) return;
    if(!confirm(`Delete "${d.name}"? This can't be undone.`)) return;
    const prevDocs = expo.docs.slice();
    expo.docs = expo.docs.filter(x=>x.id!==docId);
    const ok = await saveExpos();
    if(!ok){
      expo.docs = prevDocs;
      toast('Could not delete — try again.');
      return;
    }
    await sDelete('sais:doc:'+expoId+':'+docId);
    renderDocs();
    if(typeof onChange==='function') onChange();
  }

  const fileInput = wrap.querySelector('#docFileInput');
  const errEl = wrap.querySelector('#docErr');
  const uploadBtn = wrap.querySelector('#uploadDocBtn');
  uploadBtn.onclick = ()=>fileInput.click();
  fileInput.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    errEl.style.display='none';
    if(file.size > MAX_DOC_BYTES){
      errEl.textContent = `That file is ${fmtBytes(file.size)} — please keep documents under ${fmtBytes(MAX_DOC_BYTES)}.`;
      errEl.style.display='block';
      fileInput.value=''; return;
    }
    uploadBtn.disabled = true; uploadBtn.textContent = 'Uploading…';
    try{
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = ()=>reject(new Error('file read failed'));
        reader.readAsDataURL(file);
      });
      const docEntry = {id: uid('doc'), name: file.name, size: file.size, type: file.type, uploadedAt: new Date().toISOString()};
      const fileOk = await sSet('sais:doc:'+expoId+':'+docEntry.id, dataUrl);
      if(!fileOk){
        errEl.textContent = 'Could not save that file — your device may be low on storage.';
        errEl.style.display='block';
      } else {
        expo.docs.push(docEntry);
        const metaOk = await saveExpos();
        if(!metaOk){
          await sDelete('sais:doc:'+expoId+':'+docEntry.id);
          expo.docs = expo.docs.filter(x=>x.id!==docEntry.id);
          errEl.textContent = 'Could not save — try again.';
          errEl.style.display='block';
        } else {
          renderDocs();
          if(typeof onChange==='function') onChange();
        }
      }
    }catch(err){
      console.error(err);
      errEl.textContent = 'Could not read that file — try again.';
      errEl.style.display='block';
    }
    uploadBtn.disabled = false; uploadBtn.textContent = '+ Upload document';
    fileInput.value = '';
  });

  renderDocs();
}

/* ---------------- backup / restore ---------------- */
async function clearAllStorage(){
  await sDelete('sais:expos');
  await sDelete('sais:artists');
  const artKeys = await sList('sais:artwork:');
  for(const k of artKeys) await sDelete(k);
  const photoKeys = await sList('sais:photo:');
  for(const k of photoKeys) await sDelete(k);
  const docKeys = await sList('sais:doc:');
  for(const k of docKeys) await sDelete(k);
}
async function restoreBackup(data){
  await clearAllStorage();
  state.expos = Array.isArray(data.expos) ? data.expos : [];
  await saveExpos();
  state.artists = Array.isArray(data.artists) ? data.artists : [];
  await saveArtists();
  const imported = Array.isArray(data.artworks) ? data.artworks : [];
  const restored = [];
  for(const a of imported){
    const clean = {...a};
    if(!clean.id) clean.id = uid('art');
    const result = await saveArtwork(clean);
    if(result.ok) restored.push(clean);
  }
  state.artworks = restored;
  const docs = Array.isArray(data.docs) ? data.docs : [];
  for(const d of docs){
    if(d && d.key && d.value) await sSet(d.key, d.value);
  }
  renderFilterOptions();
  render();
}
function openBackupPanel(){
  const wrap = openOverlay(`
    <div class="panel panel-form">
      <div class="panel-head"><h2>Backup &amp; restore</h2><button class="closex" data-close>${xIcon()}</button></div>
      <div class="panel-body">
        <p class="hint" style="margin-bottom:16px;">Everything here — artworks, collections, and attached documents — lives only on this device. Export a backup file now and then, and keep it somewhere safe — an email to yourself, a cloud drive, wherever. If this device is ever lost or the app reinstalled, a backup file is the only way to get it all back.</p>
        <p class="eyebrow" style="margin-bottom:10px;">Export</p>
        <button class="btn btn-solid" id="exportBackupBtn">Download backup file</button>
        <div class="divider-hex" style="margin:22px 0 18px;">${hexDivider().replace(/<div[^>]*>|<\/div>/g,'')}</div>
        <p class="eyebrow" style="margin-bottom:10px;">Restore</p>
        <p class="hint" style="margin-bottom:10px;">Restoring replaces everything currently in the app with the contents of the backup file — the current gallery on this device will be overwritten.</p>
        <input type="file" id="restoreFileInput" accept="application/json,.json" style="display:none;">
        <button class="btn btn-plain" id="restoreBackupBtn">Choose backup file…</button>
        <p class="err-text" id="backupErr" style="display:none;"></p>
      </div>
      <div class="panel-foot"><button class="btn btn-plain" data-close>Close</button></div>
    </div>`, {persistent:true});
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));

  wrap.querySelector('#exportBackupBtn').onclick = async ()=>{
    const btn = wrap.querySelector('#exportBackupBtn');
    btn.disabled = true; btn.textContent = 'Preparing…';
    const docKeys = await sList('sais:doc:');
    const docs = [];
    for(const key of docKeys){
      const value = await sGet(key);
      if(value) docs.push({key, value});
    }
    const payload = {
      app: 'SAIS',
      version: 3,
      exportedAt: new Date().toISOString(),
      expos: state.expos,
      artists: state.artists,
      artworks: state.artworks,
      docs
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    link.href = url; link.download = `sais-backup-${stamp}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    URL.revokeObjectURL(url);
    btn.disabled = false; btn.textContent = 'Download backup file';
    toast('Backup downloaded');
  };

  const fileInput = wrap.querySelector('#restoreFileInput');
  const errEl = wrap.querySelector('#backupErr');
  wrap.querySelector('#restoreBackupBtn').onclick = ()=>fileInput.click();
  fileInput.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    errEl.style.display='none';
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.artworks) || !Array.isArray(data.expos)){
        errEl.textContent = "That doesn't look like a SAIS backup file.";
        errEl.style.display='block';
        fileInput.value=''; return;
      }
      const count = data.artworks.length;
      const docCount = Array.isArray(data.docs) ? data.docs.length : 0;
      const proceed = confirm(`Restore this backup? It will replace everything currently in the app (${state.artworks.length} artworks) with the backup's ${count} artworks${docCount?` and ${docCount} document${docCount>1?'s':''}`:''}. This can't be undone.`);
      if(!proceed){ fileInput.value=''; return; }
      const btn = wrap.querySelector('#restoreBackupBtn');
      btn.disabled = true; btn.textContent = 'Restoring…';
      await restoreBackup(data);
      btn.disabled = false; btn.textContent = 'Choose backup file…';
      toast('Backup restored');
      closeOverlay(wrap);
    }catch(err){
      console.error(err);
      errEl.textContent = "Could not read that file — make sure it's an unedited SAIS backup .json file.";
      errEl.style.display='block';
    }
    fileInput.value = '';
  });
}

/* ---------------- publish (public visitor gallery) ---------------- */
async function loadPublishConfig(){
  const v = await sGet('sais:publish-config');
  return v ? JSON.parse(v) : {owner:'', repo:'', token:''};
}
async function savePublishConfig(cfg){
  return await sSet('sais:publish-config', JSON.stringify(cfg));
}
function buildPublicSnapshot(){
  return {
    publishedAt: new Date().toISOString(),
    orgName: "Sacha's Wunderkammer",
    expos: state.expos.map(x=>({id:x.id, name:x.name, date:x.date||'', venue:x.venue||'', order:x.order||0})),
    artworks: state.artworks.map(a=>({
      id:a.id, title:a.title, artist:a.artist, year:a.year||'', material:a.material||'',
      measurements:a.measurements||'', price:a.price, currency:a.currency||'EUR',
      status:a.status||'available', expoId:a.expoId||'', order:a.order||0, photos:a.photos||[]
    }))
  };
  // Deliberately excluded: artist profiles (private contact/bio info), attached documents
  // (signed agreements), admin PIN, catalogue notes — none of that is meant for visitors.
}
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p)=>String.fromCharCode('0x'+p)));
}
async function publishToGitHub(owner, repo, token, snapshot){
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/catalog.json`;
  const headers = {Authorization: 'token '+token, Accept: 'application/vnd.github+json'};
  let sha = null;
  const getRes = await fetch(apiUrl, {headers});
  if(getRes.status===200){
    const j = await getRes.json();
    sha = j.sha;
  } else if(getRes.status!==404){
    const j = await getRes.json().catch(()=>({}));
    throw new Error(j.message || ('Could not check the existing file (HTTP '+getRes.status+').'));
  }
  const body = {
    message: 'Publish catalog update — '+new Date().toISOString(),
    content: b64EncodeUnicode(JSON.stringify(snapshot, null, 2))
  };
  if(sha) body.sha = sha;
  const putRes = await fetch(apiUrl, {
    method:'PUT', headers:{...headers, 'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!putRes.ok){
    const j = await putRes.json().catch(()=>({}));
    throw new Error(j.message || ('HTTP '+putRes.status));
  }
  return true;
}

      </div>
      <div id="priceSheet"></div>
    </div>`);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(wrap));

  function draw(){
    const expoSel = wrap.querySelector('#plExpo').value;
    const inclSold = wrap.querySelector('#plIncludeSold').checked;
    const inclNfs = wrap.querySelector('#plIncludeNfs').checked;
    const groups = expoSel==='all' ? sortedExpos() : sortedExpos().filter(x=>x.id===expoSel);
    const groupsPlusNone = [...groups];
    const hasUngrouped = state.artworks.some(a=>!a.expoId && (expoSel==='all'));

    let html = `<p class="plist-date">${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>`;

    function rowsFor(list){
      const items = sortedArtworksFor(list).filter(a=>{
        if(a.status==='sold' && !inclSold) return false;
        if(a.status==='nfs' && !inclNfs) return false;
        return true;
      });
      if(!items.length) return '<p class="plist-empty">No works to list.</p>';
      return items.map(a=>{
        const right = a.status==='sold'
          ? '<span class="soldtxt">Sold</span>'
          : (a.status==='nfs' ? '<span class="soldtxt">NFS</span>' : esc(money(a.price,a.currency)));
        const cover = a.photos && a.photos[0];
        return `<div class="plist-row">
          ${cover ? `<img class="thumb" src="${cover}" alt="">` : `<div class="thumb-placeholder">No photo</div>`}
          <div class="body">
            <div class="t">${esc(a.title)||'Untitled'} — ${esc(a.artist)||''}${a.year?', '+esc(a.year):''}</div>
            <div class="m">${[a.material,a.measurements].filter(Boolean).map(esc).join(' · ')}</div>
            ${a.notes ? `<div class="notes">${esc(a.notes)}</div>` : ''}
          </div>
          <div class="r">${right}</div>
        </div>`;
      }).join('');
    }

    groupsPlusNone.forEach(g=>{
      const items = state.artworks.filter(a=>a.expoId===g.id);
      html += `<div class="expo-group"><h3>${esc(g.name)} ${g.date?`<span class="expo-date">${esc(g.date)}</span>`:''}</h3>${rowsFor(items)}</div>`;
    });
    if(hasUngrouped){
      const items = state.artworks.filter(a=>!a.expoId);
      html += `<div class="expo-group"><h3>Uncategorized</h3>${rowsFor(items)}</div>`;
    }
    if(!groupsPlusNone.length && !hasUngrouped){
      html += `<p class="plist-empty">No collections yet.</p>`;
    }
    wrap.querySelector('#priceSheet').innerHTML = html;
  }
  wrap.querySelector('#plExpo').addEventListener('change', draw);
  wrap.querySelector('#plIncludeSold').addEventListener('change', draw);
  wrap.querySelector('#plIncludeNfs').addEventListener('change', draw);
  wrap.querySelector('#printBtn').addEventListener('click', ()=>window.print());
  wrap.querySelector('#artlogicBtn').addEventListener('click', ()=>{
    const expoSel = wrap.querySelector('#plExpo').value;
    const inclSold = wrap.querySelector('#plIncludeSold').checked;
    const inclNfs = wrap.querySelector('#plIncludeNfs').checked;
    const list = state.artworks.filter(a=>{
      if(expoSel!=='all' && a.expoId!==expoSel) return false;
      if(a.status==='sold' && !inclSold) return false;
      if(a.status==='nfs' && !inclNfs) return false;
      return true;
    });
    exportArtlogicXlsx(sortedArtworksFor(list));
  });
  draw();
}

function exportArtlogicXlsx(artworks){
  if(typeof XLSX === 'undefined'){
    toast('Could not load the export library — check your connection and try again.');
    return;
  }
  const rows = [ARTLOGIC_HEADERS];
  artworks.forEach(a=>{
    const row = new Array(ARTLOGIC_HEADERS.length).fill('');
    row[ARTLOGIC_HEADERS.indexOf('Artist')] = a.artist || '';
    row[ARTLOGIC_HEADERS.indexOf('Title')] = a.title || '';
    row[ARTLOGIC_HEADERS.indexOf('Year')] = a.year || '';
    row[ARTLOGIC_HEADERS.indexOf('Dimensions')] = a.measurements || '';
    row[ARTLOGIC_HEADERS.indexOf('Retail price')] = (a.price===''||a.price==null) ? '' : a.price;
    rows.push(row);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `sais-artlogic-import-${stamp}.xlsx`);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW registration failed', e)); });
  // When an update finishes installing, the new worker takes over automatically
  // (our sw.js calls skipWaiting + clients.claim) — reload once so the page
  // itself picks up the new code, instead of needing a manual close/reopen twice.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
