<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SAIS — Exposure</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF6;--card:#fff;--ink:#221D14;--mut:#6B6252;--line:#E3D9C0;--acc:#A97D40;--gold:#A97D40;--ok:#1f8a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3,.big{font-family:Fraunces,Georgia,serif;margin:0;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:4px;padding:12px 16px;overflow-x:auto;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-family:Fraunces,serif;font-weight:800;margin-right:12px;white-space:nowrap}.logo b{color:var(--acc)}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--ink)}button.on,button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.a{background:var(--acc);border-color:var(--acc);color:#fff}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hero{padding:10px 0 26px}.big{font-size:clamp(48px,11vw,120px);line-height:.95}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}.bar.ok i{background:linear-gradient(90deg,var(--gold),#f0c24a)}.bar.lg{height:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:22px}.stat b{display:block;font:800 30px Fraunces,serif}
.sec{margin:38px 0 14px;display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0002}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card .in{padding:12px}.card h3{font-size:16px}.need{font-size:12px;font-weight:800;color:var(--acc);margin-top:8px;letter-spacing:.05em}.need.ok{color:var(--ok)}
.tag{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:99px}
.rec{display:flex;gap:14px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer}.rec img{width:64px;height:84px;object-fit:cover;border-radius:8px}.rec .n{font:800 34px Fraunces;color:var(--acc);width:34px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl input{max-width:220px}.ctl select{width:auto}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.mo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:130px}
.ev{display:block;width:100%;text-align:left;border-radius:10px;margin-top:6px;padding:6px 10px;font-size:13px;border-color:var(--line)}.ev.up{border-left:4px solid var(--acc)}.ev small{color:var(--mut);display:block}
.tl{position:relative;height:110px;margin:20px 0;border-bottom:2px solid var(--ink)}.tl .m{position:absolute;bottom:-22px;font-size:10px;color:var(--mut)}.dot{position:absolute;bottom:-7px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);padding:0;transform:translateX(-50%)}.dot.past{background:var(--ink)}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px}.ov.s{display:block}
.mod{background:var(--bg);max-width:820px;margin:0 auto;border-radius:22px;padding:22px;position:relative}.x{position:absolute;right:14px;top:14px}
.prof{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:22px}@media(max-width:640px){.prof{grid-template-columns:1fr}}.prof img{width:100%;border-radius:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.pick{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}.pick input{width:auto}.pick img{width:34px;height:44px;object-fit:cover;border-radius:5px}.pick span{flex:1}
.sum{position:sticky;bottom:-22px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.sum b{font:800 22px Fraunces}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2 label{font-size:12px;color:var(--mut)}
.ach{display:flex;gap:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}.ach.lock{opacity:.5}.ach .e{font-size:30px}
.tw{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:800;z-index:40;display:none;letter-spacing:.04em;max-width:90vw;text-align:center}.tw.s{display:block;animation:pop .5s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.hb .bar{flex:1;height:14px}.hb .bar i{background:var(--ink)}.hb span:first-child{width:64px;color:var(--mut)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}nav .more{display:none}
@media(min-width:0px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;overflow:visible}nav button{flex:1;border:0;border-radius:12px;padding:12px 2px;font-size:12px}nav .x2{display:none}nav .more{display:block}main{padding-bottom:110px}input,select,textarea{font-size:16px}.tw{bottom:90px}.big{font-size:clamp(44px,16vw,80px)}}
/* ---- dark glass theme ---- */
:root{--bg:#0d0c0a;--card:rgba(255,255,255,.045);--ink:#f2ecdf;--mut:#9b927e;--line:rgba(255,255,255,.1);--acc:#c9a15a;--gold:#e0bb75;--ok:#5fcf9b;color-scheme:dark}
body{background:radial-gradient(1100px 600px at 85% -10%,rgba(201,161,90,.16),transparent 60%),radial-gradient(900px 500px at -10% 105%,rgba(110,90,200,.09),transparent 60%),#0d0c0a;background-attachment:fixed}html{scroll-behavior:smooth}
h1,h2,h3,.big{font-family:'Space Grotesk','Inter',sans-serif}
header.top{background:rgba(13,12,10,.72);backdrop-filter:blur(18px)}
.card,.mo,.rec,.ach,.pick,.ev{backdrop-filter:blur(10px);border-radius:18px}.ev{border-radius:12px}
.card:hover{box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 1px rgba(201,161,90,.45)}
.bar{background:rgba(255,255,255,.08)}.bar i,.hb .bar i{background:linear-gradient(90deg,#8a6530,#e6c684)}
.bar.ok i{background:linear-gradient(90deg,#e6c684,#fff1c9);box-shadow:0 0 16px rgba(230,198,132,.6)}
button.on,button.p,button.a{background:linear-gradient(135deg,#e0bb75,#a97d40);color:#14110b;border-color:transparent}
input,select,textarea{background:rgba(255,255,255,.05)}
.mod{background:#151310;border:1px solid var(--line)}.ov{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.sum{background:rgba(201,161,90,.16);border:1px solid rgba(201,161,90,.4);color:var(--ink);backdrop-filter:blur(10px)}
.tw,.tag{background:linear-gradient(135deg,#e0bb75,#a97d40);color:#14110b}
nav{left:12px!important;right:12px!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;max-width:560px;margin:0 auto!important;border-radius:22px!important;border:1px solid rgba(255,255,255,.1)!important;background:rgba(24,22,18,.7)!important;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 14px 40px rgba(0,0,0,.6);padding:6px!important;}
nav button{border:0}nav button.onbackground:linear-gradient(135deg,#e0bb75,#a97d40)!important;color:#14110b!important;box-shadow:0 0 18px rgba(201,161,90,.35)
</style><meta name="theme-color" content="#0d0c0a">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head><body>
<header class="top"><a class="logo" href="index.html" style="color:inherit;text-decoration:none">← SAIS <b>·</b> Exposure</a><span id="yr"></span></header><nav></nav><main id="app"></main>
<div class="ov" id="ov"><div class="mod" id="mod"></div></div><div class="tw" id="tw"></div>
<script>
const $=s=>document.querySelector(s),TODAY=new Date().toISOString().slice(0,10),CY=+TODAY.slice(0,4);
const TY={fair:['Art Fair',1],open:['Solo Opening',1],close:['Solo Closing',1],social:['Social Media',1],gallery:['Gallery Exhibition',.1],other:['Other',.5]};
const f=n=>(Math.round(n*10)/10).toFixed(1),eur=n=>'€'+Math.round(n).toLocaleString('en'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),uid=()=>Math.random().toString(36).slice(2,9);
const dt=d=>new Date(d+'T00:00').toLocaleDateString('en',{month:'short',day:'numeric'}).toUpperCase(),add=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
let S,view='home',flt='all',q='',sort='need',sel=new Set(),EV=null;
/* storage */
const idb=()=>new Promise((a,b)=>{const r=indexedDB.open('sais-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'key'});r.onsuccess=()=>a(r.result);r.onerror=()=>b()});
const kv=(m,fn)=>idb().then(d=>new Promise(a=>{const q=fn(d.transaction('kv',m).objectStore('kv'));q.onsuccess=()=>a(q.result);q.onerror=()=>a(null)}));
const kget=async k=>{const r=await kv('readonly',s=>s.get(k));return r?r.value:null};
const dset=()=>({home:'Belgium',target:8,coef:Object.fromEntries(Object.entries(TY).map(([k,v])=>[k,v[1]]))});
async function load(){try{const ks=(await kv('readonly',s=>s.getAllKeys()))||[],arts=[];
for(const k of ks.filter(k=>k.startsWith('sais:artwork:'))){try{const m=JSON.parse(await kget(k)),ph=m.photoCount?await kget('sais:photo:'+m.id+':0'):'';arts.push({id:m.id,title:m.title||'Untitled',artist:m.artist||'',year:m.year||'',medium:m.material||'',dimensions:m.measurements||'',price:+m.price||0,image:ph||gen(arts.length+1),status:m.status||'available',targetExposureHours:null,createdAt:'',order:m.order||0,expoId:m.expoId||''})}catch(e){}}
const x=JSON.parse(await kget('sais:x:data')||'null')||{events:[],sales:[],set:dset()};
if(!arts.length&&!x.events.length)return null;const ids=new Set(arts.map(a=>a.id));x.events.forEach(e=>e.artworkIds=e.artworkIds.filter(i=>ids.has(i)));
return{expos:JSON.parse(await kget('sais:expos')||'[]'),artworks:arts,events:x.events,sales:x.sales||[],set:x.set||dset(),year:CY}}catch(e){return null}}
async function save(){if(S.isDemo)return;try{await kv('readwrite',s=>s.put({key:'sais:x:data',value:JSON.stringify({events:S.events,sales:S.sales,set:S.set})}))}catch(e){}}
async function setStatus(id,st){if(S.isDemo)return;const k='sais:artwork:'+id,raw=await kget(k);if(!raw)return;const m=JSON.parse(raw);m.status=st;await kv('readwrite',s=>s.put({key:k,value:JSON.stringify(m)}))}
/* demo */
const rng=s=>()=>(s=s*16807%2147483647,(s-1)/2147483646);
function gen(seed){const r=rng(seed*97+13),h=r()*360,c=(o,l)=>`hsl(${(h+o)%360} ${40+r()*40}% ${l}%)`;let s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'><rect width='300' height='400' fill='${c(0,88)}'/>`;for(let i=0;i<5;i++){const t=r(),x=r()*300|0,y=r()*400|0,z=40+r()*130|0;s+=t<.4?`<circle cx='${x}' cy='${y}' r='${z/1.5|0}' fill='${c(r()*90,50)}' opacity='.85'/>`:t<.75?`<rect x='${x}' y='${y}' width='${z}' height='${z*(.5+r())|0}' fill='${c(r()*120,45)}' opacity='.8'/>`:`<path d='M0 ${y}Q150 ${y+z-80} 300 ${y+40}' stroke='${c(180,30)}' stroke-width='${6+r()*18|0}' fill='none'/>`}return'data:image/svg+xml,'+encodeURIComponent(s+'</svg>')}
function demo(){const r=rng(7),T=['Untitled #17','Blue Painting','Red Painting','Salt Field','Night Swimmer','Ochre Hours','Harbour, 6 a.m.','Lull','Terrazzo Sun','Quiet Machine','Paper Moon','Green Interval','Low Tide Study','Afterimage','Vessel','Second Winter','Kiln','Small Weather','Pink Noise','Untitled 2026'],M=['Oil on canvas','Acrylic on linen','Oil on panel','Mixed media'];
const artworks=T.map((t,i)=>({id:'a'+i,title:t,artist:'Studio Vermeer',year:2022+i%5,medium:M[i%4],dimensions:[80,100,120,60][i%4]+' × '+[100,120,90,80][i%4]+' cm',price:1500+Math.round(r()*7)*500,image:gen(i+1),status:'available',targetExposureHours:null,createdAt:TODAY}));
const L=[['Ochre Hours — Opening','open',-260,1,'18:00','22:00','Antwerp',''],['Spring carousel','social',-240,1,'12:00','13:00','','Instagram'],['Art Brussels','fair',-215,2,'11:00','15:00','Brussels',''],['Galerie Nord group show','gallery',-180,10,'12:00','16:00','Berlin',''],['Open studio day','other',-150,1,'10:00','16:00','Antwerp',''],['Ochre Hours — Closing','close',-120,1,'16:00','18:00','Antwerp',''],['Studio reel','social',-90,1,'18:00','19:00','','Instagram'],['Art Cologne','fair',-60,1,'10:00','14:00','Cologne',''],['Berlin group show II','gallery',-40,10,'12:00','16:00','Berlin',''],['Process post','social',-20,1,'09:00','10:00','','Instagram'],['New York fair','fair',-30,1,'10:00','14:00','New York',''],
['Story takeover','social',6,1,'19:00','20:00','','Instagram'],['Drawing Now Paris','fair',18,3,'10:00','14:00','Paris',''],['London solo — Opening','open',45,1,'18:00','21:00','London',''],['Gallery Nord spring','gallery',70,10,'12:00','16:00','Berlin',''],['London solo — Closing','close',100,1,'16:00','18:00','London',''],['Art Rotterdam','fair',130,2,'10:00','16:00','Rotterdam',''],['New year reel','social',200,1,'18:00','19:00','','Instagram']];
const N={fair:12,open:14,close:12,social:4,gallery:8,other:6};
const events=L.map((e,i)=>({id:'e'+i,name:e[0],type:e[1],date:add(e[2]),endDate:add(e[2]+e[3]-1),startTime:e[4],endTime:e[5],intensity:null,location:e[6],platform:e[7],artworkIds:artworks.map(a=>a.id).sort(()=>r()-.5).slice(0,N[e[1]])}));
const sales=[[0,-170,'Antwerp'],[3,-110,'Brussels'],[7,-75,'Paris'],[10,-45,'Berlin'],[14,-15,'New York']].map(([i,d,c])=>({artworkId:'a'+i,saleDate:add(d),salePrice:artworks[i].price,city:c,country:CT[c].country,region:CT[c].region}));
sales.forEach(s=>{artworks.find(a=>a.id==s.artworkId).status='sold';events.forEach(e=>{if(e.date>s.saleDate)e.artworkIds=e.artworkIds.filter(x=>x!=s.artworkId)})});
return{artworks,events,sales,set:{home:'Belgium',target:8,coef:Object.fromEntries(Object.entries(TY).map(([k,v])=>[k,v[1]]))},year:CY,isDemo:true}}
/* model */
const T=a=>a.targetExposureHours||S.set.target,cf=e=>e.intensity??S.set.coef[e.type]??1,tH=t=>{const[h,m]=(t||'0:0').split(':');return+h+m/60};
const hrs=e=>((new Date(e.endDate||e.date)-new Date(e.date))/864e5+1)*Math.max(0,tH(e.endTime)-tH(e.startTime)),xh=e=>hrs(e)*cf(e);
const sold=a=>S.sales.find(s=>s.artworkId==a.id)||(a.status=='sold'?{artworkId:a.id,salePrice:a.price,saleDate:TODAY}:null),cut=()=>S.year<CY?S.year+'-12-31':S.year>CY?'0':TODAY;
const expo=(a,u=TODAY)=>S.events.reduce((t,e)=>t+(e.date<=u&&e.artworkIds.includes(a.id)?xh(e):0),0);
const proj=a=>S.events.reduce((t,e)=>t+(e.artworkIds.includes(a.id)?xh(e):0),0);
const ups=()=>S.events.filter(e=>e.date>TODAY).sort((a,b)=>a.date>b.date?1:-1);
const avail=()=>S.artworks.filter(a=>!sold(a)),deficit=a=>Math.max(0,T(a)-expo(a,cut()));
const bar=(v,t,c='')=>`<div class="bar ${v>=t?'ok':''} ${c}"><i data-w="${Math.min(100,v/t*100)}"></i></div>`;
function toast(m){const t=$('#tw');t.textContent=m;t.className='tw s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='tw',3800)}
/* render */
const TABS=[['inv','Inventory'],['home','Dashboard'],['cal','Events'],['an','Insights'],['man','Manage']];
function render(){document.querySelectorAll('nav button,nav select').forEach(x=>x.remove());const n=$('nav');
n.insertAdjacentHTML('beforeend',TABS.map((t,i)=>`<button data-a="tab" data-id="${t[0]}" class="${view==t[0]?'on':''} ">${t[1]}</button>`).join(''));$('#yr').innerHTML=`<select data-a="year" style="width:auto">${[CY-1,CY,CY+1,CY+2].map(y=>`<option ${y==S.year?'selected':''}>${y}</option>`).join('')}</select>`;
$('#app').innerHTML={home,cal:cal2,an:an2,set}[view]();requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),30))}
function card(a){const e=expo(a,cut()),t=T(a),s=sold(a);return`<div class="card" data-a="prof" data-id="${a.id}">${s?'<span class="tag">SOLD</span>':''}<img src="${a.image}" alt="" loading="lazy"><div class="in"><h3>${esc(a.title)}</h3><div class="lab">${a.year} · ${eur(s?s.salePrice:a.price)}</div><div style="margin:10px 0 4px" class="lab">Exposure ${f(e)} / ${t}h</div>${bar(e,t)}<div class="need ${e>=t?'ok':''}">${e>=t?'TARGET REACHED ✓':'⚡ NEEDS '+f(t-e)+' HOURS'}</div></div></div>`}
function home(){const A=S.artworks,av=avail(),c=cut(),tot=A.length*S.set.target||1,got=A.reduce((s,a)=>s+Math.min(T(a),expo(a,c)),0),atT=A.filter(a=>expo(a,c)>=T(a)).length,need=av.filter(a=>expo(a,c)<T(a)),def=av.reduce((s,a)=>s+deficit(a),0),nx=ups();
let L=A.filter(a=>(flt=='all'||(flt=='sold'?sold(a):flt=='av'?!sold(a):flt=='need'?!sold(a)&&expo(a,c)<T(a):expo(a,c)>=T(a)))&&(a.title+a.medium+a.year).toLowerCase().includes(q.toLowerCase()));
L.sort((a,b)=>sort=='need'?deficit(b)-deficit(a):sort=='price'?b.price-a.price:sort=='year'?b.year-a.year:a.title.localeCompare(b.title));
const top=[...av].sort((a,b)=>deficit(b)-deficit(a)).slice(0,5);
return`<div class="hero"><div class="lab">Exposure year</div><div class="big">${S.year}</div><div class="lab" style="margin:16px 0 8px">Portfolio exposure</div>${bar(got,tot,'lg')}<div style="margin-top:8px"><b class="big" style="font-size:36px">${Math.round(got/tot*100)}%</b> <span class="lab">&nbsp;${f(got)} / ${tot} exposure hours</span></div>
<div class="stats">${[['Works',A.length],['Sold',A.length-av.length],['Available',av.length],['At target',atT],['Need exposure',need.length],['Deficit',f(def)+'h']].map(x=>`<div class="stat"><span class="lab">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>
${sc()}<div class="sec"><h2>Which works need exposure?</h2><span class="lab">${nx[0]?'Next opportunity: '+esc(nx[0].name)+' · '+dt(nx[0].date):'No upcoming opportunities'}</span></div>
${top.map((a,i)=>{const e=expo(a,c),n=nx.find(v=>!v.artworkIds.includes(a.id));return`<div class="rec" data-a="prof" data-id="${a.id}"><span class="n">${i+1}</span><img src="${a.image}"><div style="flex:1"><h3>${esc(a.title)}</h3><div class="lab">${f(e)} / ${T(a)}h</div><div class="need">NEEDS ${f(deficit(a))}h${n?` · <span style="color:var(--mut)">try ${esc(n.name)} → ${f(e+xh(n))}h</span>`:''}</div></div></div>`}).join('')||'<p class="lab">Every available work is at target 🎯</p>'}
<div class="sec"><h2>Next up</h2><a class="lab" href="index.html">Open inventory in SAIS →</a></div>${nx.slice(0,4).map(evChip).join('')||'<p class="lab">No upcoming events yet. Add one under Events.</p>'}`}

<div class="ctl" style="margin-top:16px">${s?`<button data-a="unsell" data-id="${id}">Undo sale</button>`:`<button class="a" data-a="sell" data-id="${id}">Mark sold</button>`}</div></div></div>`)}
function artForm(id){const a=id?S.artworks.find(x=>x.id==id):{title:'',year:CY,medium:'',dimensions:'',price:0,image:''};open(`<h2>${id?'Edit':'New'} artwork</h2><div class="f2" style="margin-top:14px"><div><label>Title</label><input id="f_t" value="${esc(a.title)}"></div><div><label>Year</label><input id="f_y" type="number" value="${a.year}"></div><div><label>Medium</label><input id="f_m" value="${esc(a.medium)}"></div><div><label>Dimensions</label><input id="f_d" value="${esc(a.dimensions)}"></div><div><label>Price (€)</label><input id="f_p" type="number" value="${a.price}"></div><div><label>Target hours (blank = default)</label><input id="f_g" type="number" step=".5" value="${a.targetExposureHours||''}"></div></div><p><label class="lab">Image</label><input type="file" id="f_i" accept="image/*"></p><button class="a" data-a="saveart" data-id="${id||''}">Save</button>`)}
const img=file=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=fr.result};fr.readAsDataURL(file)});
function evForm(id){const e=id?S.events.find(x=>x.id==id):{name:'',type:'fair',date:TODAY,endDate:TODAY,startTime:'10:00',endTime:'14:00',intensity:null,location:'',platform:'',artworkIds:[]};EV=id;sel=new Set(e.artworkIds);
open(`<div class="lab">${e.date>TODAY?'Upcoming opportunity':'Event'}</div><h2>${id?esc(e.name):'New event'}</h2><div class="f2" style="margin:14px 0" id="ef"><div><label>Name</label><input id="e_n" value="${esc(e.name)}"></div><div><label>Type</label><select id="e_t">${Object.keys(TY).map(k=>`<option value="${k}" ${e.type==k?'selected':''}>${TY[k][0]}</option>`).join('')}</select></div><div><label>From</label><input type="date" id="e_d" value="${e.date}"></div><div><label>To</label><input type="date" id="e_e" value="${e.endDate||e.date}"></div><div><label>Daily start</label><input type="time" id="e_s" value="${e.startTime}"></div><div><label>Daily end</label><input type="time" id="e_x" value="${e.endTime}"></div><div><label>Intensity % (blank = default)</label><input type="number" id="e_i" value="${e.intensity==null?'':Math.round(e.intensity*100)}"></div><div><label>Location / platform</label><input id="e_l" list="cl" value="${esc(e.location||e.platform)}"><datalist id="cl">${Object.keys(CT).map(c=>`<option>${c}</option>`).join('')}</datalist></div></div>
<div class="fl f2" style="margin-bottom:12px"><div><label>Debrief: visitors</label><input type="number" id="e_a" value="${e.attendance||''}"></div><div><label>Debrief: note</label><input id="e_o" value="${esc(e.note||'')}"></div></div><div class="sec" style="margin:10px 0"><h3>Choose works</h3><span><button data-a="pickN">Most in need (8)</button> <button data-a="pickC">Clear</button></span></div><div class="fl f2" style="margin-bottom:8px"><input id="p_q" placeholder="Search title / artist"><select id="p_a"><option value="">All artists</option>${[...new Set(S.artworks.map(a=>a.artist).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="p_lo" type="number" placeholder="Min €"><input id="p_hi" type="number" placeholder="Max €"><label style="grid-column:span 2"><input type="checkbox" id="p_u" style="width:auto"> Only works under target</label></div><div id="pk"></div><div class="sum" id="sm"></div><p><button class="a" data-a="saveev">Save event</button> ${id?'<button data-a="delev">Delete</button>':''}</p>`);updEv()}
function evNow(){const g=i=>$('#'+i).value,e={type:g('e_t'),date:g('e_d'),endDate:g('e_e')||g('e_d'),startTime:g('e_s'),endTime:g('e_x'),intensity:g('e_i')===''?null:+g('e_i')/100};return e}
function updEv(){const e=evNow(),each=xh(e),T0=S.set.target,ex=S.events.find(x=>x.id==EV),base=a=>S.events.reduce((t,v)=>t+(v.date<=TODAY&&v.id!=EV&&v.artworkIds.includes(a.id)?xh(v):0),0);
const v=i=>($('#'+i)||{}).value||'',q=v('p_q').toLowerCase(),ar=v('p_a'),lo=+v('p_lo')||0,hi=+v('p_hi')||1e9,un=($('#p_u')||{}).checked,L0=S.artworks.filter(a=>!sold(a)||sel.has(a.id)),L=L0.filter(a=>(a.title+a.artist).toLowerCase().includes(q)&&(!ar||a.artist==ar)&&a.price>=lo&&a.price<=hi&&(!un||base(a)<T(a))).sort((a,b)=>(T(b)-base(b))-(T(a)-base(a)));$('#pk').innerHTML=L.map(a=>{const b=base(a),p=b+each;return`<label class="pick"><input type="checkbox" data-a="pk" data-id="${a.id}" ${sel.has(a.id)?'checked':''}><img src="${a.image}"><span><b>${esc(a.title)}</b><br><small class="lab">${f(b)} / ${T(a)}h${b>=T(a)?' · at target, still unsold':''}</small></span><b style="color:${sel.has(a.id)&&p>=T(a)?'var(--ok)':'inherit'}">${sel.has(a.id)?'→ '+f(p)+'h'+(p>=T(a)?' ✓':''):''}</b></label>`}).join('');
const S1=L0.filter(a=>sel.has(a.id)),r=S1.filter(a=>base(a)+each>=T(a)).length;$('#sm').innerHTML=`<div><span class="lab">Selected</span><br><b>${S1.length}</b></div><div><span class="lab">Each</span><br><b>+${f(each)}h</b></div><div><span class="lab">Total added</span><br><b>+${f(each*S1.length)}h</b></div><div><span class="lab">Reaching target</span><br><b>${r}</b></div><div><span class="lab">Still under</span><br><b>${S1.length-r}</b></div><div style="flex-basis:100%;font-size:12px;opacity:.85">By artist: ${Object.entries(S1.reduce((m,a)=>(m[a.artist||'—']=(m[a.artist||'—']||0)+1,m),{})).map(x=>x[0]+' '+x[1]).join(' · ')||'—'}</div>`;EV_BASE=base}
let EV_BASE;
function saveEv(){const e=evNow(),n=$('#e_n').value.trim()||TY[e.type][0],l=$('#e_l').value,before=S.artworks.map(a=>[a,proj(a)]);e.name=n;e.location=e.type=='social'?'':l;e.platform=e.type=='social'?l:'';e.artworkIds=[...sel];e.attendance=+$('#e_a').value||null;e.note=$('#e_o').value;
if(EV){Object.assign(S.events.find(x=>x.id==EV),e)}else S.events.push({id:uid(),...e});
const hit=before.filter(([a,b])=>b<T(a)&&proj(a)>=T(a)).length;save();close();render();toast(hit?`🏆 ${hit} work${hit>1?'s':''} ${e.date>TODAY?'will reach':'reached'} target ✓`:'Event saved')}
function ioBox(m){open(`<h2>${m=='e'?'Export':'Import'} JSON</h2><textarea id="io" rows="12" style="margin:12px 0" ${m=='e'?'readonly':''}>${m=='e'?esc(JSON.stringify({events:S.events,sales:S.sales,set:S.set})):''}</textarea>${m=='e'?'<button class="p" data-a="cp">Copy</button>':'<input type="file" id="iof" accept=".json"><p><button class="a" data-a="doimp">Import</button></p><p class="lab">Paste JSON or choose a file. This replaces current data.</p>'}`)}
/* events */
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT'||t.tagName=='INPUT'&&t.dataset.a!='pk')return;const a=t.dataset.a,id=t.dataset.id,A=id&&S.artworks.find(x=>x.id==id);
if(a=='tab'){if(id=='inv')return location.href='index.html';if(id=='man')return location.href='index.html#manage';view=id;history.replaceState(null,'','#'+id);close();render();scrollTo(0,0)}else if(a=='more')open('<h2 style="margin-bottom:14px">More</h2>'+TABS.slice(4).map(t=>`<button class="${view==t[0]?'on':''}" data-a="tab" data-id="${t[0]}" style="display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:12px">${t[1]}</button>`).join(''));else if(a=='close')close();else if(a=='prof')prof(id);else if(a=='newart')artForm();else if(a=='editart')artForm(id);
else if(a=='saveart'){const g=i=>$('#f_'+i).value,o=id?A:{id:uid(),status:'available',createdAt:TODAY,artist:'Me',image:''};Object.assign(o,{title:g('t')||'Untitled',year:+g('y'),medium:g('m'),dimensions:g('d'),price:+g('p'),targetExposureHours:+g('g')||null});const fl=$('#f_i').files[0];if(fl)o.image=await img(fl);if(!o.image)o.image=gen(Math.random()*999|0);if(!id)S.artworks.push(o);save();close();render()}
else if(a=='delart'){if(confirm('Delete this artwork?')){S.artworks=S.artworks.filter(x=>x.id!=id);S.sales=S.sales.filter(s=>s.artworkId!=id);S.events.forEach(e=>e.artworkIds=e.artworkIds.filter(x=>x!=id));save();close();render()}}
else if(a=='sell')open(`<h2>Mark sold</h2><div class="f2" style="margin:14px 0"><div><label>Price €</label><input id="s_p" type="number" value="${A.price}"></div><div><label>Date</label><input id="s_d" type="date" value="${TODAY}"></div><div><label>City sold</label><input id="s_c" list="cl" placeholder="e.g. London"></div><div><label>Country (auto)</label><input id="s_k"></div></div><datalist id="cl">${Object.keys(CT).map(c=>`<option>${c}</option>`).join('')}</datalist><button class="a" data-a="dosell" data-id="${id}">Confirm sale</button>`);
else if(a=='dosell'){const ci=$('#s_c').value.trim(),g=geo(ci);S.sales.push({artworkId:id,saleDate:$('#s_d').value,salePrice:+$('#s_p').value,city:ci,country:$('#s_k').value.trim()||g?.country||'',region:g?.region||'Other'});A.status='sold';await setStatus(id,'sold');save();close();render();toast('Sold at '+f(expo(A,$('#s_d').value))+'h of exposure')}
else if(a=='unsell'){S.sales=S.sales.filter(s=>s.artworkId!=id);A.status='available';await setStatus(id,'available');save();close();render()}
else if(a=='ev')evForm(id||null);else if(a=='fromexpo'){const used=new Set(S.events.map(e=>e.expoId).filter(Boolean)),L=(S.expos||[]).filter(x=>!used.has(x.id));open('<h2 style="margin-bottom:6px">From a SAIS collection</h2><p class="lab" style="margin-bottom:14px">Creates an event with that collection\'s works, so nothing is entered twice.</p>'+(L.map(x=>`<button data-a="mkexpo" data-id="${x.id}" style="display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border-radius:12px">${esc(x.name)}<br><small class="lab">${esc(x.date||'')} ${esc(x.venue||'')}</small></button>`).join('')||'<p class="lab">No unlinked collections.</p>'))}else if(a=='mkexpo'){const x=S.expos.find(v=>v.id==id),d=/^\d{4}-\d{2}-\d{2}/.test(x.date||'')?x.date.slice(0,10):TODAY,n=uid();S.events.push({id:n,name:x.name,type:'gallery',date:d,endDate:d,startTime:'10:00',endTime:'18:00',intensity:null,location:x.venue||'',platform:'',expoId:id,artworkIds:S.artworks.filter(a=>a.expoId==id&&!sold(a)).map(a=>a.id)});save();evForm(n)}else if(a=='pk'){t.checked?sel.add(id):sel.delete(id);updEv()}
else if(a=='pickC'){sel.clear();updEv()}else if(a=='pickN'){S.artworks.filter(x=>!sold(x)).sort((x,y)=>(T(y)-EV_BASE(y))-(T(x)-EV_BASE(x))).slice(0,8).forEach(x=>sel.add(x.id));updEv()}
else if(a=='saveev')saveEv();else if(a=='delev'){S.events=S.events.filter(x=>x.id!=EV);save();close();render()}
else if(a=='saveset'){S.set.target=+$('#tgt').value||8;S.set.home=$('#hm').value||'Belgium';document.querySelectorAll('[data-k]').forEach(i=>S.set.coef[i.dataset.k]=(+i.value||0)/100);save();render();toast('Settings saved')}
else if(a=='exp')ioBox('e');else if(a=='imp')ioBox('i');else if(a=='cp'){$('#io').select();try{await navigator.clipboard.writeText($('#io').value)}catch(e){document.execCommand('copy')}toast('Copied')}
else if(a=='doimp'){try{let x=$('#io').value;const fl=$('#iof').files[0];if(fl)x=await fl.text();const d=JSON.parse(x);if(!d.events)throw 0;S.events=d.events;S.sales=d.sales||[];S.set=d.set||S.set;save();close();render();toast('Imported')}catch(e){toast('Invalid JSON')}}
else if(a=='demo'){if(confirm('Replace all data with demo data?')){S=demo();save();render()}}
else if(a=='clear'){if(confirm('Delete everything?')){S.events=[];S.sales=[];save();render()}}});
document.addEventListener('input',e=>{const a=e.target.dataset.a;if(a=='q'){q=e.target.value;render();const i=$('[data-a=q]');i.focus();i.setSelectionRange(q.length,q.length)}else if(e.target.closest('#ef,.fl'))updEv()});
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a=='flt'){flt=e.target.value;render()}else if(a=='sort'){sort=e.target.value;render()}else if(a=='year'){S.year=+e.target.value;save();render()}else if(e.target.closest('#ef,.fl'))updEv()});
document.getElementById('ov').addEventListener('mousedown',e=>{if(e.target.id=='ov')close()});
(async()=>{S=await load();if(!S)S=demo();S.year=S.year||CY;const h=location.hash.slice(1);if(['home','cal','an','set'].includes(h))view=h;render();if(S.isDemo)toast('Demo data — add works in SAIS and they appear here')})();
</script></body></html>
